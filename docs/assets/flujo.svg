<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="t d" font-family="sans-serif">
<title id="t">Circuito del ahorro familiar</title><desc id="d">El chico carga un logro, un adulto lo aprueba, el monto suma al saldo, el chico pide un rescate, un adulto lo aprueba y lo entrega.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#091430"/></marker></defs>
<g fill="#fff" stroke="#091430" stroke-width="2">
<rect x="20" y="40" width="150" height="70" rx="8"/><rect x="215" y="40" width="150" height="70" rx="8"/><rect x="410" y="40" width="150" height="70" rx="8"/><rect x="605" y="40" width="150" height="70" rx="8"/>
<rect x="215" y="190" width="150" height="70" rx="8"/><rect x="410" y="190" width="150" height="70" rx="8"/><rect x="605" y="190" width="150" height="70" rx="8"/></g>
<g font-size="15" fill="#091430" text-anchor="middle">
<text x="95" y="72">Hijo/a</text><text x="95" y="92">carga un logro</text>
<text x="290" y="72">Adulto</text><text x="290" y="92">aprueba o corrige</text>
<text x="485" y="72">Saldo visible</text><text x="485" y="92">(historial completo)</text>
<text x="680" y="72">Hijo/a</text><text x="680" y="92">pide un rescate</text>
<text x="680" y="212">Adulto aprueba</text><text x="680" y="232">y entrega</text>
<text x="485" y="212">Se descuenta</text><text x="485" y="232">del saldo</text>
<text x="290" y="212">Metas de ahorro</text><text x="290" y="232">con barra de avance</text></g>
<g stroke="#091430" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M170 75H213"/><path d="M365 75H408"/><path d="M560 75H603"/><path d="M680 110V188"/><path d="M603 225H562"/><path d="M408 225H367"/></g>
</svg>
