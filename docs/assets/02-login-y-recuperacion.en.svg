<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Sign-in and account recovery</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#163b60"/></marker><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#cee6fb"/></linearGradient></defs><rect width="100%" height="100%" fill="#fff"/><text x="800" y="65" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="65" font-weight="700" fill="#071632">Sign-in and account recovery</text><rect x="22" y="138" width="902" height="1036" rx="22" fill="#fff" stroke="#afc4d6" stroke-width="4"/><rect x="940" y="138" width="638" height="1036" rx="22" fill="#fff" stroke="#afc4d6" stroke-width="4"/><text x="470" y="190" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="48" font-weight="700" fill="#071632">Sign-in</text><text x="1258" y="190" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="48" font-weight="700" fill="#071632">Recovery</text><rect x="183" y="236" width="580" height="88" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="473.0" y="280.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">Username + 6-digit PIN</text><polyline points="473,324 473,365" fill="none" stroke="#163b60" stroke-width="5" marker-end="url(#arrow)"/><polygon points="473,366.0 613.0,445 473,524.0 333.0,445" fill="#fff0ce" stroke="#986000" stroke-width="4"/><text x="473" y="445.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">Locked out?</text><polyline points="613,445 708,445" fill="none" stroke="#986000" stroke-width="5" marker-end="url(#arrow)"/><text x="650" y="418" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#986000">Yes</text><rect x="710" y="400" width="194" height="94" rx="15" fill="#ffe3e3" stroke="#b52525" stroke-width="4"/><text x="807.0" y="428.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#071632">Wait for</text><text x="807.0" y="466.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#071632">unlock</text><polyline points="473,524 473,580" fill="none" stroke="#986000" stroke-width="5" marker-end="url(#arrow)"/><text x="520" y="545" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#986000">No</text><rect x="191" y="581" width="563" height="116" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="472.5" y="620.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">Argon2id verification</text><text x="472.5" y="658.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#071632">Dummy hash if the user does not exist</text><polyline points="473,697 473,735" fill="none" stroke="#163b60" stroke-width="5" marker-end="url(#arrow)"/><polygon points="473,734.0 623.0,818 473,902.0 323.0,818" fill="#fff0ce" stroke="#986000" stroke-width="4"/><text x="473" y="802.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">Verification</text><text x="473" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">successful?</text><polyline points="323,818 248,818 248,943" fill="none" stroke="#986000" stroke-width="5" marker-end="url(#arrow)"/><text x="280" y="874" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#986000">Yes</text><polyline points="623,818 697,818 697,943" fill="none" stroke="#986000" stroke-width="5" marker-end="url(#arrow)"/><text x="733" y="882" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#986000">No</text><rect x="47" y="945" width="417" height="192" rx="15" fill="#d9f5df" stroke="#13733d" stroke-width="4"/><text x="255.5" y="984.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#071632">Session</text><text x="255.5" y="1022.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#071632">10-minute inactivity timeout</text><text x="255.5" y="1060.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#071632">Cookies: Secure · HttpOnly</text><text x="255.5" y="1098.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#071632">SameSite=Strict</text><rect x="489" y="945" width="416" height="192" rx="15" fill="#ffe3e3" stroke="#b52525" stroke-width="4"/><text x="697.0" y="1003.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#071632">Failure</text><text x="697.0" y="1041.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#071632">5 failures/user → 15 min</text><text x="697.0" y="1079.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#071632">20 failures/IP → 30 min</text><rect x="1005" y="239" width="513" height="78" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="1261.5" y="278.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">Request using username</text><polyline points="1262,317 1262,359" fill="none" stroke="#163b60" stroke-width="5" marker-end="url(#arrow)"/><rect x="1005" y="359" width="513" height="81" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="1261.5" y="399.5" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">Same response every time</text><polyline points="1262,440 1262,482" fill="none" stroke="#163b60" stroke-width="5" marker-end="url(#arrow)"/><rect x="1005" y="482" width="513" height="81" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="1261.5" y="522.5" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">Up to 3 requests per hour</text><polyline points="1262,563 1262,610" fill="none" stroke="#163b60" stroke-width="5" marker-end="url(#arrow)"/><rect x="1005" y="610" width="513" height="106" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="1261.5" y="644.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">256-bit token</text><text x="1261.5" y="682.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#071632">Only its hash is stored</text><polyline points="1262,716 1262,756" fill="none" stroke="#163b60" stroke-width="5" marker-end="url(#arrow)"/><rect x="1005" y="756" width="513" height="106" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="1261.5" y="790.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">Email with reset link</text><text x="1261.5" y="828.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#071632">Single-use · Expires in 30 min</text><polyline points="1262,862 1262,909" fill="none" stroke="#163b60" stroke-width="5" marker-end="url(#arrow)"/><rect x="1005" y="909" width="513" height="81" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="1261.5" y="949.5" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">New PIN</text><polyline points="1262,990 1262,1034" fill="none" stroke="#163b60" stroke-width="5" marker-end="url(#arrow)"/><rect x="1005" y="1034" width="513" height="90" rx="15" fill="url(#blue)" stroke="#123855" stroke-width="4"/><text x="1261.5" y="1079.0" text-anchor="middle" dominant-baseline="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#071632">All sessions are invalidated</text></svg>